
# CholoBodlai Spring Boot Application
spring.application.name=CholoBodlai

# Local port 8080 / Render supplied port
server.port=${PORT:8080}

# HTTPS reverse proxy support
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=${APP_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax

# Thymeleaf
spring.thymeleaf.cache=false

# MongoDB Atlas
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/cholobodlai}
spring.config.import=optional:classpath:application-local.properties

# JWT Authentication
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=86400000

# Demo Database
app.demo.seed=${APP_DEMO_SEED:false}

# Cloudinary / Local File Storage
app.media.backend=${APP_MEDIA_BACKEND:auto}
app.documents.directory=${APP_DOCUMENT_DIR:./uploads/truck-documents}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Admin bootstrap credentials are supplied
# via APP_ADMIN_PHONE and APP_ADMIN_PASSWORD

# EMAIL VERIFICATION
# Set false to allow registrations without verification.
app.email.verification-required=${APP_EMAIL_VERIFICATION_REQUIRED:false}

# Email Delivery
app.mail.preview=${APP_MAIL_PREVIEW:false}
app.mail.from=${APP_MAIL_FROM:noreply@cholobodlai.example}

# Public Website URL
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

# Optional email sending via Resend or SMTP.
# Forgot Password requires a configured email provider.