<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Notifications')}"></head><body class="app-page"><header th:replace="~{fragments/layout :: nav}"></header><main class="container dashboard-page slim-page"><div class="page-intro"><span class="eyebrow">STAY UP TO DATE</span><h1>Your notifications.</h1><p>Account updates, trip offers, winning bids and delivery progress.</p></div><section class="content-card"><div class="feed-list"><article class="notification-row" th:each="n : ${items}" th:classappend="${n.read ? '' : ' unread'}"><div class="feed-dot"></div><div class="notification-content"><p th:text="${n.message}">Notification</p><small th:text="${n.createdAt}">Time</small></div><form th:if="${!n.read}" th:action="@{/notifications/{id}/read(id=${n.id})}" method="post"><button class="btn btn-secondary btn-small">Mark read</button></form><span th:if="${n.read}" class="tag tag-light">Read</span></article></div><div class="empty-state" th:if="${#lists.isEmpty(items)}"><span class="empty-icon">✉</span><h3>All caught up</h3><p>Important updates will appear here.</p></div></section></main></body></html>
