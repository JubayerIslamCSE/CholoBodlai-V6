# CholoBodlai — same Spring Boot/Atlas architecture as the original project.
spring.application.name=CholoBodlai
server.port=${PORT:8080}
# Correct HTTPS headers and secure cookies when Render terminates TLS.
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=${APP_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
spring.thymeleaf.cache=false

# IntelliJ: set MONGODB_URI to your existing Atlas connection string.
# Alternatively put the URI in application-local.properties (gitignored).
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/cholobodlai}
spring.config.import=optional:classpath:application-local.properties

# Supply a permanent 32+ character secret with APP_JWT_SECRET for API tokens.
# If unset, a fresh secure key is generated on every local startup.
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=86400000

# Enable only against a separate EMPTY demo database (never your real data).
app.demo.seed=${APP_DEMO_SEED:false}

# Storage: auto uses Cloudinary if all three CLOUDINARY_* variables are present.
# Set APP_MEDIA_BACKEND=cloudinary on Render. LOCAL fallback is only for IntelliJ.
app.media.backend=${APP_MEDIA_BACKEND:auto}
app.documents.directory=${APP_DOCUMENT_DIR:./uploads/truck-documents}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# APP_ADMIN_PHONE and APP_ADMIN_PASSWORD are read from IntelliJ environment variables.

# Render Free blocks common SMTP ports. RESEND_API_KEY uses HTTPS for public verification and resets.
# APP_MAIL_FROM must be an address from your verified Resend sender domain.
# SMTP is still optional for local testing or paid hosts.
# For a locally demonstrated inbox, enable APP_MAIL_PREVIEW=true.
# NEVER enable mail preview on Render or on a publicly accessible deployment.
app.mail.preview=${APP_MAIL_PREVIEW:false}
app.mail.from=${APP_MAIL_FROM:noreply@cholobodlai.example}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
# Production HTTPS email: RESEND_API_KEY, APP_MAIL_FROM.
# Real SMTP alternative: SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
# SPRING_MAIL_PASSWORD, and optional SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true,
# SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true.
