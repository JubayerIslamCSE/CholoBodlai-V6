name: Java 21 checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test without production secrets
        run: mvn -B --no-transfer-progress test
      - name: Restore-scroll regression checks
        run: node qa/scroll-regression.test.cjs
      - name: Smoke-test Cloudinary request signing with a local fake server
        run: sh qa/run-cloudinary-smoke.sh
      - name: Run backend input/role policy checks
        run: sh qa/run-policy-smoke.sh
