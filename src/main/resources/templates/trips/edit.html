<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Edit trip request')}"></head><body class="app-page"><header th:replace="~{fragments/layout :: nav}"></header><main class="container dashboard-page slim-page"><div class="page-intro"><a class="back-link" th:href="@{/trips/{id}(id=${editingTrip.id})}">← Back to request</a><span class="eyebrow">EDIT OPEN REQUEST</span><h1>Change your trip details.</h1><p>You can edit only before receiving an offer. Existing bids are never silently invalidated.</p></div>
<section class="content-card form-card"><form th:action="@{/trips/{id}/edit(id=${editingTrip.id})}" method="post">
<div class="form-field"><label for="truckTypeId">Requested truck</label><select id="truckTypeId" name="truckTypeId" required><option th:each="t : ${truckTypes}" th:value="${t.id}" th:text="${t.name}" th:selected="${t.id == editingTrip.requestedTypeId}"></option></select></div>
<div class="form-grid"><div class="form-field"><label>Pickup location</label><input name="pickupLocation" th:value="${editingTrip.pickupLocation}" maxlength="180" required></div><div class="form-field"><label>Destination</label><input name="dropoffLocation" th:value="${editingTrip.dropoffLocation}" maxlength="180" required></div></div>
<div class="form-grid"><div class="form-field"><label>Distance (km)</label><input name="distanceKm" type="number" min="0.1" max="10000" step="0.1" th:value="${editingTrip.distanceKm}" required></div><div class="form-field"><label>Cargo weight (kg)</label><input name="cargoWeightKg" type="number" min="0.1" max="50000" step="0.1" th:value="${editingTrip.cargoWeightKg}"></div></div>
<div class="form-field"><label for="loadingTime">Preferred pickup time <span class="required">*</span></label><input type="datetime-local" id="loadingTime" name="loadingTime" th:value="${loadingTimeValue}" th:attr="min=${minPickupTime}" step="60" required data-minimum-pickup><small>Choose a pickup time at least 48 hours (2 days) from now. All times use Bangladesh time; older dates cannot be saved.</small></div>
<div class="form-field"><label>Cargo details</label><textarea name="productDetails" rows="4" maxlength="1500" th:text="${editingTrip.productDetails}"></textarea></div>
<label class="check-row"><input name="roundTrip" type="checkbox" value="true" th:checked="${editingTrip.roundTrip}"> Include a return trip</label>
<div class="form-actions"><button type="submit" class="btn btn-primary btn-large">Save updates ↗</button><a class="btn btn-secondary btn-large" th:href="@{/trips/{id}(id=${editingTrip.id})}">Back</a></div>
</form></section></main></body></html>
